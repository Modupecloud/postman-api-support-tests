name: Automated Postman API Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collections
        run: |
          newman run 01_CRUD_Operations.postman_collection.json --insecure || true
          newman run 02_Error_Handling_Tests.postman_collection.json --insecure || true
          newman run 03_Auth_And_Headers.postman_collection.json --insecure || true
          newman run 04_Dynamic_Workflows.postman_collection.json --insecure || true
          newman run 05_Stripe_Webhooks.postman_collection.json --insecure || true
