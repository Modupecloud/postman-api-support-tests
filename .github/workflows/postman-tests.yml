name: Automated Postman API Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman & Reporter
        run: |
          npm install -g newman

      - name: Run Collection 1 - CRUD Operations
        run: newman run 01_CRUD_Operations.postman_collection.json

      - name: Run Collection 2 - Error Handling
        run: newman run 02_Error_Handling_Tests.postman_collection.json

      - name: Run Collection 3 - Auth & Headers
        run: newman run 03_Auth_And_Headers.postman_collection.json

      - name: Run Collection 4 - Dynamic Workflows
        run: newman run 04_Dynamic_Workflows.postman_collection.json

      - name: Run Collection 5 - Stripe Webhooks
        run: newman run 05_Stripe_Webhooks.postman_collection.json
